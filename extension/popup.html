<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniToDo Focus Monitor</title>
  <link rel="stylesheet" href="popup.css">
  <script src="core.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="brand-row">
    <div class="brand">
      <img src="icons/icon-48.png" width="34" height="34" alt="">
      <div><strong>UniToDo <span>Focus</span></strong></div>
    </div>
    <label class="switch" title="モニターのON/OFF">
      <input id="enabled" type="checkbox" aria-label="モニターを有効にする" checked>
      <span class="switch-track"></span>
    </label>
  </header>

  <main>
    <section class="timer-panel" id="timer-panel" data-kind="muted" aria-label="現在の計測">
      <div class="status"><span class="status-dot"></span><span id="status-label">接続を確認しています</span></div>
      <div class="timer" id="timer-value" role="timer" aria-live="off">00:00</div>
      <div class="progress-track"><div id="progress-value"></div></div>
      <div class="timer-footer"><span id="threshold-note">1分で画面に表示</span><span id="direction-note">待機中</span></div>
    </section>

    <div class="work-row"><span>作業</span><strong id="work-title">UniToDoの状態を確認中</strong></div>
    <section class="quick-controls" aria-label="表示と仕事用の除外">
      <label class="setting-row" for="bounce-enabled">
        <div><strong>動かして強調</strong><small id="bounce-note">5分から移動。反射するたびに色が変わります。</small></div>
        <span class="switch"><input id="bounce-enabled" type="checkbox" checked><span class="switch-track"></span></span>
      </label>
      <div class="button-row">
        <button id="exclude-tab" type="button" disabled>このタブを15分除外</button>
        <button id="preview" type="button" class="subtle" disabled>表示テスト</button>
      </div>
      <p class="helper" id="exclusion-note"></p>
    </section>

    <details id="settings-details" name="focus-settings">
      <summary>表示・計測の設定</summary>
      <form id="settings-form">
        <label class="field-row" for="timer-size"><span>タイマーのサイズ</span><output id="timer-size-value" for="timer-size">48 px</output></label>
        <input id="timer-size" class="size-slider" type="range" min="16" max="160" step="1" value="48" aria-label="タイマーのサイズ（ピクセル）">
        <label class="field-row" for="threshold-seconds"><span>表示を始めるまで</span><span class="number-field"><input id="threshold-seconds" type="number" min="10" max="3600" step="1" value="60" required>秒</span></label>
        <label class="field-row" for="bounce-threshold-seconds"><span>動き出すまで</span><span class="number-field"><input id="bounce-threshold-seconds" type="number" min="10" max="3600" step="1" value="300" aria-describedby="bounce-threshold-help" required>秒</span></label>
        <p id="bounce-threshold-help" class="helper">タイマーの値が指定時間に達すると動きます。OFFなら右下に固定します。</p>
        <label class="field-row" for="recovery-rate"><span>離れている間の減少</span><select id="recovery-rate"><option value="0.5">毎秒 0.5秒</option><option value="1" selected>毎秒 1秒</option><option value="2">毎秒 2秒</option></select></label>
        <button type="submit" class="save-button">設定を保存</button>
      </form>
    </details>
    <details id="sites-details" name="focus-settings">
      <summary>対象サイト</summary>
      <div class="site-choices" role="group" aria-label="標準の対象サイト"><label><input id="monitor-social" type="checkbox" checked>X / Twitter</label><label><input id="monitor-video" type="checkbox" checked>YouTube</label></div>
      <ul id="custom-sites" class="custom-sites" aria-label="追加した対象サイト"></ul>
      <form id="site-form" class="site-form">
        <label for="site-input">追加するURLまたはドメイン</label>
        <div class="site-input-row"><input id="site-input" type="text" placeholder="example.com" maxlength="2048" autocomplete="off" spellcheck="false" required><button id="add-site" type="submit">追加</button></div>
      </form>
      <p class="helper">ドメイン単位でサブドメインも含みます。登録時にChromeがアクセス許可を確認します。</p>
    </details>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>

  <footer><span class="local-dot"></span>このChrome内で計測 <span class="footer-separator">·</span><a href="http://127.0.0.1:48120" target="_blank" rel="noreferrer">UniToDoを開く ↗</a></footer>
</body>
</html>
